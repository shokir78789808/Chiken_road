<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chicken Road 2D Action</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --accent: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --text: #f8fafc;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--card);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      font-size: 16px;
      font-weight: 900;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-deposit {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .flag-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #1e293b;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #334155;
    }

    .balance-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
    }
    .balance-val {
      color: #38bdf8;
      font-size: 16px;
      font-weight: 900;
    }

    /* Холст с игрой */
    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }
    canvas {
      background: #1e293b;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 400px;
      display: block;
    }

    /* Блок управления */
    .controls {
      width: 100%;
      max-width: 420px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bet-selector {
      display: flex;
      gap: 8px;
    }
    .bet-btn {
      flex: 1;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 8px 0;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .bet-btn.active {
      background: var(--accent);
      color: #0b0f19;
      border-color: var(--accent);
    }

    .action-group {
      display: flex;
      gap: 8px;
    }
    .btn-step {
      flex: 2;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0b0f19;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
    }
    .btn-cashout {
      flex: 1.5;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
      display: none;
    }

    /* Модалки */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .modal-btn {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      margin-top: 14px;
      cursor: pointer;
    }
    .modal-close {
      width: 100%;
      background: #334155;
      color: #94a3b8;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>🐔</span> Chicken Road
    </div>
    <div class="top-actions">
      <button class="btn-deposit" onclick="openBonus()">+ Бонус</button>
      <div class="flag-badge">
        <span>🇹🇯</span>
        <span>TJ</span>
      </div>
    </div>
  </header>

  <div class="balance-bar">
    <span>Фишки для игры:</span>
    <span class="balance-val" id="userBalance">100.00 TJS</span>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="360" height="420"></canvas>
  </div>

  <div class="controls">
    <div style="font-size: 11px; color: #94a3b8; font-weight: 700;">СТАВКА ФИШЕК:</div>
    <div class="bet-selector">
      <button class="bet-btn active" onclick="setBet(5, this)">5</button>
      <button class="bet-btn" onclick="setBet(10, this)">10</button>
      <button class="bet-btn" onclick="setBet(25, this)">25</button>
      <button class="bet-btn" onclick="setBet(50, this)">50</button>
    </div>

    <div class="action-group">
      <button class="btn-step" id="stepBtn" onclick="gameAction()">СТАРТ (5 TJS) 🚀</button>
      <button class="btn-cashout" id="cashoutBtn" onclick="cashOut()">ЗАБРАТЬ 💰</button>
    </div>
  </div>

  <div class="modal-backdrop" id="bonusModal">
    <div class="modal">
      <h3>🎁 Бонусные фишки</h3>
      <p style="font-size: 13px; color: #94a3b8; margin: 10px 0;">Закончились фишки? Нажми кнопку, чтобы пополнить счет на +100 фишек для игры с друзьями!</p>
      <button class="modal-btn" onclick="claimBonus()">Получить +100 TJS 🪙</button>
      <button class="modal-close" onclick="closeBonus()">Закрыть</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Звуки
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, dur) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let balance = parseFloat(localStorage.getItem('chicken_balance')) || 100.0;
    let bet = 5.0;
    let gameState = 'IDLE'; // IDLE, PLAYING, CRASHED, WON
    let currentLane = 0; // 0: Старт, 1..5: Полосы дороги, 6: Финиш
    const laneMultipliers = [1.0, 1.25, 1.65, 2.30, 3.40, 5.00];

    // Размеры поля (6 полос + старт + финиш)
    const totalLanes = 6;
    const laneHeight = canvas.height / (totalLanes + 1); // ~60px
    
    // Курица
    const chicken = {
      x: canvas.width / 2,
      y: canvas.height - laneHeight / 2,
      targetY: canvas.height - laneHeight / 2,
      radius: 14,
      frame: 0
    };

    // Машины на полосах
    const cars = [];
    const carColors = ['#ef4444', '#3b82f6', '#eab308', '#a855f7', '#ec4899'];
    for (let i = 1; i <= 5; i++) {
      const speed = (i % 2 === 0 ? 1 : -1) * (1.2 + i * 0.4);
      cars.push({
        lane: i,
        x: Math.random() * canvas.width,
        y: canvas.height - (i + 0.5) * laneHeight,
        w: 48,
        h: 24,
        speed: speed,
        color: carColors[i - 1]
      });
      // Вторая машина на той же полосе для плотности
      cars.push({
        lane: i,
        x: (Math.random() * canvas.width + 180) % canvas.width,
        y: canvas.height - (i + 0.5) * laneHeight,
        w: 46,
        h: 24,
        speed: speed,
        color: carColors[(i + 2) % carColors.length]
      });
    }

    function setBet(amount, btn) {
      if (gameState === 'PLAYING') return;
      bet = amount;
      document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('stepBtn').innerText = `СТАРТ (${bet} TJS) 🚀`;
      playTone(440, 'sine', 0.1);
    }

    function updateBalanceDisplay() {
      localStorage.setItem('chicken_balance', balance);
      document.getElementById('userBalance').innerText = `${balance.toFixed(2)} TJS`;
    }
    updateBalanceDisplay();

    function gameAction() {
      if (gameState === 'IDLE' || gameState === 'CRASHED' || gameState === 'WON') {
        if (balance < bet) {
          openBonus();
          return;
        }
        balance -= bet;
        updateBalanceDisplay();
        currentLane = 1;
        gameState = 'PLAYING';
        chicken.targetY = canvas.height - (currentLane + 0.5) * laneHeight;
        document.getElementById('stepBtn').innerText = 'ШАГ ВПЕРЁД 🐔';
        document.getElementById('cashoutBtn').style.display = 'block';
        updateCashoutBtn();
        playTone(350, 'triangle', 0.15);
      } else if (gameState === 'PLAYING') {
        if (currentLane < 5) {
          currentLane++;
          chicken.targetY = canvas.height - (currentLane + 0.5) * laneHeight;
          updateCashoutBtn();
          playTone(350 + currentLane * 60, 'triangle', 0.15);
          if (currentLane === 5) {
            document.getElementById('stepBtn').innerText = 'НА ФИНИШ 🏁';
          }
        } else if (currentLane === 5) {
          currentLane = 6; // Финиш
          chicken.targetY = laneHeight / 2;
          gameState = 'WON';
          const win = bet * laneMultipliers[5];
          balance += win;
          updateBalanceDisplay();
          playTone(800, 'sine', 0.4);
          document.getElementById('stepBtn').innerText = 'ПОБЕДА! ЕЩЁ РАЗ 🏆';
          document.getElementById('cashoutBtn').style.display = 'none';
        }
      }
    }

    function updateCashoutBtn() {
      const currentWin = (bet * laneMultipliers[currentLane]).toFixed(2);
      document.getElementById('cashoutBtn').innerText = `ЗАБРАТЬ (${currentWin}) 💰`;
    }

    function cashOut() {
      if (gameState !== 'PLAYING') return;
      const win = bet * laneMultipliers[currentLane];
      balance += win;
      updateBalanceDisplay();
      playTone(700, 'sine', 0.3);
      alert(`🎉 Вы забрали ${win.toFixed(2)} TJS!`);
      resetToIdle();
    }

    function resetToIdle() {
      gameState = 'IDLE';
      currentLane = 0;
      chicken.targetY = canvas.height - laneHeight / 2;
      chicken.y = chicken.targetY;
      document.getElementById('cashoutBtn').style.display = 'none';
      document.getElementById('stepBtn').innerText = `СТАРТ (${bet} TJS) 🚀`;
    }

    // Игровой цикл Canvas
    function update() {
      // Плавное движение курицы
      chicken.y += (chicken.targetY - chicken.y) * 0.25;

      // Движение машин
      cars.forEach(car => {
        car.x += car.speed;
        if (car.speed > 0 && car.x > canvas.width + 40) car.x = -50;
        if (car.speed < 0 && car.x < -60) car.x = canvas.width + 50;

        // Проверка столкновения
        if (gameState === 'PLAYING') {
          const chickenLaneY = canvas.height - (car.lane + 0.5) * laneHeight;
          if (Math.abs(chicken.y - chickenLaneY) < 16) {
            if (chicken.x > car.x - 14 && chicken.x < car.x + car.w + 14) {
              // Авария
              gameState = 'CRASHED';
              playTone(130, 'sawtooth', 0.4);
              document.getElementById('stepBtn').innerText = 'РАЗДАВИЛИ! ЗАНОВО 🔄';
              document.getElementById('cashoutBtn').style.display = 'none';
            }
          }
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Обочина Старта
      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, canvas.height - laneHeight, canvas.width, laneHeight);
      ctx.fillStyle = '#86efac';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('СТАРТОВАЯ ЗОНА', 16, canvas.height - laneHeight / 2 + 4);

      // 2. Дороги
      for (let i = 1; i <= 5; i++) {
        const y = canvas.height - (i + 1) * laneHeight;
        ctx.fillStyle = (i % 2 === 0) ? '#1e293b' : '#0f172a';
        ctx.fillRect(0, y, canvas.width, laneHeight);

        // Разделительная пунктирная полоса
        ctx.strokeStyle = '#475569';
        ctx.setLineDash([12, 12]);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Множитель на полосе
        ctx.fillStyle = 'rgba(245, 158, 11, 0.45)';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(`x${laneMultipliers[i].toFixed(2)}`, canvas.width - 50, y + laneHeight / 2 + 5);
      }

      // 3. Финиш
      ctx.fillStyle = '#b45309';
      ctx.fillRect(0, 0, canvas.width, laneHeight);
      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('🏁 ФИНИШ x5.00', 16, laneHeight / 2 + 5);

      // 4. Отрисовка Машин
      cars.forEach(car => {
        ctx.fillStyle = car.color;
        ctx.beginPath();
        ctx.roundRect(car.x, car.y - car.h / 2, car.w, car.h, 6);
        ctx.fill();

        // Лобовое стекло
        ctx.fillStyle = '#0f172a';
        const glassX = car.speed > 0 ? car.x + car.w - 14 : car.x + 4;
        ctx.fillRect(glassX, car.y - car.h / 2 + 3, 10, car.h - 6);

        // Фары
        ctx.fillStyle = '#fef08a';
        if (car.speed > 0) {
          ctx.fillRect(car.x + car.w - 2, car.y - 8, 2, 4);
          ctx.fillRect(car.x + car.w - 2, car.y + 4, 2, 4);
        } else {
          ctx.fillRect(car.x, car.y - 8, 2, 4);
          ctx.fillRect(car.x, car.y + 4, 2, 4);
        }
      });

      // 5. Отрисовка Курицы
      if (gameState === 'CRASHED') {
        ctx.font = '32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💥', chicken.x, chicken.y + 10);
      } else {
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🐔', chicken.x, chicken.y + 9);
      }
      ctx.textAlign = 'left';

      update();
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    function openBonus() { document.getElementById('bonusModal').style.display = 'flex'; }
    function closeBonus() { document.getElementById('bonusModal').style.display = 'none'; }
    function claimBonus() {
      balance += 100.0;
      updateBalanceDisplay();
      playTone(600, 'sine', 0.2);
      closeBonus();
      alert('Вам начислено +100 фишек! Удачи на дорогах!');
    }
  </script>
</body>
</html>
